name: Android app

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "fonts/**"
      - "icons/**"
      - "audio/**"
      - "android/**"
      - "scripts/build-www.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Check the game rules and pacing
        run: npm test

      - name: Copy the web app into the Android project
        run: npm run sync

      - name: Read the app version
        id: version
        run: echo "number=$(grep -oE 'var APP_VERSION=[0-9]+' index.html | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/long-ascent.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.number }}
        run: |
          # A published file is never swapped for another: someone may be downloading it. New build, new version.
          if gh release view "v$V" --json assets --jq '.assets[].name' 2> /dev/null | grep -qx "long-ascent.apk"; then
            echo "::warning::Version $V is already published and was left as it is. To publish this build, raise APP_VERSION in index.html and CACHE in sw.js."
          elif gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" long-ascent.apk
          else
            gh release create "v$V" long-ascent.apk --title "Long Ascent $V" --notes "Android app. On your phone, download long-ascent.apk and open it to install or update." --latest
          fi
